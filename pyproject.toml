[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openfawe"
version = "1.0.0"
description = "OpenFAWE: simulation of airborne wind energy kites - free-vortex-wake aerodynamics (vortex step method, CPU/GPU tree codes, rotor vortex rings), tether, ground station, power system and whole flights of the Makani M600 under its own flight controller (OpenFAWE Studio)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "third_party/LICENSE-*.txt"]
authors = [{ name = "Yinong Tian" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.3,<3", "h5py>=3.12,<4", "psutil>=7,<8"]

[project.optional-dependencies]
fast = ["numpy>=2.3,<2.4", "scipy==1.16.3", "numba==0.62.1", "threadpoolctl==3.5.0"]
paper = ["matplotlib>=3.9", "pyvista>=0.44", "Pillow>=10"]
# OpenFAWE Studio from source (apps/studio), with "fast"; the versions the released program was built with
studio = ["PySide6-Essentials==6.11.2", "pyqtgraph==0.14.0", "pyvista==0.49.0", "pyvistaqt==0.13.1", "vtk==9.7.1", "QtPy==2.4.3", "Pillow==12.3.0"]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/robytian/OpenFAWE"

[tool.setuptools.packages.find]
where = ["src"]
